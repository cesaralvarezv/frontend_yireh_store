name: yireh_store
description: "Aplicacion movil Yireh Store - clientes y cajeros."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.0
  intl: ^0.19.0
  image_picker: ^1.1.2

  # QR Code generation (Fase 4)
  qr_flutter: ^4.1.0

  # Star rating widget (Fase 4 - CSAT)
  flutter_rating_bar: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/launch_image.png
    - assets/images/logo_launcher_1024.png
